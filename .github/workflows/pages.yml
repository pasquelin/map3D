# Vitrine GitHub Pages. Squelette commun aux trois dépôts (map3D, panels, IA Studio) :
# mêmes déclencheurs, mêmes versions d'actions, même garde-fou avant publication, même
# artefact `_site`. Ce qui diffère ici tient aux seules particularités réelles de ce
# dépôt — le dépôt de plugins à côté, et les jetons de la démo.
#
# Source Pages = GitHub Actions, jamais une branche : rien de compilé n'est versionné,
# tout est rebâti à chaque push sur `main`.
#
# La démo importe `@map3d/plugin-*`, qui vit dans un AUTRE dépôt (public). Les deux
# dépôts sont donc checkout côte à côte dans le workspace, exactement comme en local :
# `examples/react/vite.config.ts` aliase `../../../plugingsMap3D/packages/*/src`.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'repo.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  # Les mêmes chemins en pull request : on bâtit sans déployer, pour qu'une vitrine
  # cassée se voie avant la fusion et non après.
  pull_request:
    paths:
      - 'site/**'
      - 'src/**'
      - 'examples/**'
      - 'scripts/**'
      - 'repo.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours : une publication à moitié
# écrite est pire qu'une publication en retard.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer la librairie
        uses: actions/checkout@v7
        with:
          path: map3D

      - name: Récupérer les plugins (dépôt public séparé)
        uses: actions/checkout@v7
        with:
          repository: pasquelin/plugingsMap3D
          path: plugingsMap3D

      - name: Installer pnpm
        uses: pnpm/action-setup@v6

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version-file: map3D/.nvmrc
          cache: pnpm
          cache-dependency-path: map3D/pnpm-lock.yaml

      - name: Installer les dépendances de la librairie
        working-directory: map3D
        run: pnpm install --frozen-lockfile

      # Les alias pointent vers les SOURCES des plugins : leurs propres imports
      # (`@mdi/js`, `three`) doivent être résolvables depuis leur dossier.
      - name: Installer les dépendances des plugins
        working-directory: plugingsMap3D
        run: pnpm install --no-frozen-lockfile

      # La vitrine n'est publiée que si ce qu'elle montre tient debout.
      - name: Valider
        working-directory: map3D
        run: pnpm validate

      # Une seule commande bâtit tout le site : le décor, la démo React et les quinze
      # langues. Les chemins de sortie vivent dans `repo.config.json`, pas ici — ce
      # fichier n'a donc rien à savoir de l'arborescence publiée.
      - name: Bâtir la vitrine
        working-directory: map3D
        env:
          # Secrets facultatifs : absents, la démo retombe sur le globe ellipsoïde et
          # le fournisseur de tuiles interne. Les définir dans les secrets du dépôt
          # suffit à les activer, sans toucher à ce workflow.
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
        run: pnpm build:site

      - name: Préparer Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Téléverser l'artefact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: map3D/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
