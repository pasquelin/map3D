# Filet anti-régression : à chaque push sur main et sur chaque PR, on rejoue le même
# garde-fou que `pnpm validater` en local — typecheck strict, lint, format:check et la
# suite de tests. Un test qui casse (ou un `any`/format qui glisse) bloque la fusion.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une PR qui pousse un nouveau commit annule le run précédent : on ne paie que le dernier état.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # typecheck + lint + format:check + test — cf. le script `validater` de package.json.
      - name: Valider (typecheck, lint, format, tests)
        run: pnpm validater
